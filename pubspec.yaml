name: soteria
description: "Soteria is a premium competitive learning platform built with Flutter, following high-end engineering standards and clean architecture."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ---------------------------------------------------------------------------
  # Flutter / UI
  # ---------------------------------------------------------------------------

  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  google_fonts: ^8.2.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  cupertino_icons: ^1.0.9

  # ---------------------------------------------------------------------------
  # Utilities
  # ---------------------------------------------------------------------------

  intl: ^0.20.3
  shared_preferences: ^2.5.5
  logger: ^2.7.0
  shimmer: ^3.0.0
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  uuid: ^4.6.0
  crypto: ^3.0.6
  connectivity_plus: ^6.1.3

  # ---------------------------------------------------------------------------
  # Serialization / Models
  # ---------------------------------------------------------------------------

  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # ---------------------------------------------------------------------------
  # Native Splash
  # ---------------------------------------------------------------------------

  flutter_native_splash: ^2.4.4

  # ---------------------------------------------------------------------------
  # Firebase
  # ---------------------------------------------------------------------------

  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  firebase_analytics: ^12.4.5
  firebase_crashlytics: ^5.2.6
  firebase_performance: ^0.11.4+5
  firebase_messaging: ^16.4.3
  firebase_remote_config: ^6.3.1
  firebase_app_check: ^0.4.5+2
  google_sign_in: ^7.2.0
  fl_chart: ^1.2.0

dev_dependencies:
  # ---------------------------------------------------------------------------
  # Testing
  # ---------------------------------------------------------------------------

  flutter_test:
    sdk: flutter

  # ---------------------------------------------------------------------------
  # Linting
  # ---------------------------------------------------------------------------

  flutter_lints: ^6.0.0

  # ---------------------------------------------------------------------------
  # Code Generation
  # ---------------------------------------------------------------------------

  build_runner: ^2.4.15
  freezed: ^3.2.5
  json_serializable: ^6.14.1

  # ---------------------------------------------------------------------------
  # Mocking
  # ---------------------------------------------------------------------------

  mockito: ^5.4.5

  flutter_launcher_icons: ^0.13.1
  integration_test:
    sdk: flutter

# =============================================================================
# FLUTTER LAUNCHER ICONS
# =============================================================================

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_icon.png"
  min_sdk_android: 24

# =============================================================================
# FLUTTER NATIVE SPLASH
# =============================================================================
#
# IMPORTANT:
# The native splash is intentionally minimal.
#
# It is NOT the actual Soteria splash design.
#
# It exists only as a seamless launch bridge while Flutter initializes.
#
# Native:
#     #090514 (Blank - as requested)
#
# Flutter:
#     splash_bg.png + logo_icon.png + Soteria branding
#
# =============================================================================

flutter_native_splash:
  color: "#090514"
  # image: "assets/images/logo_icon.png" # Removed to keep native splash blank

  android: true
  ios: true

  fullscreen: true

  android_12:
    color: "#090514"
    # image: "assets/images/logo_icon.png" # Removed to keep native splash blank

# =============================================================================
# FLUTTER
# =============================================================================

flutter:
  uses-material-design: true

  # ---------------------------------------------------------------------------
  # Assets
  # ---------------------------------------------------------------------------
  #
  # This includes:
  #
  # assets/images/splash_bg.png
  # assets/images/logo_icon.png
  #
  # along with other images stored inside this directory.
  #
  # ---------------------------------------------------------------------------

  assets:
    - assets/images/