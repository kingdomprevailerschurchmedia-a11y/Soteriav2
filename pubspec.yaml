name: soteria
description: "Soteria is a premium competitive learning platform built with Flutter, following high-end engineering standards and clean architecture."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ---------------------------------------------------------------------------
  # Flutter / UI
  # ---------------------------------------------------------------------------

  flutter_riverpod: any
  go_router: any
  google_fonts: any
  flutter_screenutil: any
  flutter_svg: any
  cupertino_icons: any

  # ---------------------------------------------------------------------------
  # Utilities
  # ---------------------------------------------------------------------------

  intl: any
  shared_preferences: any
  image_picker: any
  logger: any
  shimmer: any
  device_info_plus: any
  package_info_plus: any
  uuid: any
  crypto: any
  connectivity_plus: any
  timeago: any

  # ---------------------------------------------------------------------------
  # Serialization / Models
  # ---------------------------------------------------------------------------

  freezed_annotation: any
  json_annotation: any

  # ---------------------------------------------------------------------------
  # Native Splash
  # ---------------------------------------------------------------------------

  flutter_native_splash: ^2.4.4

  # ---------------------------------------------------------------------------
  # Firebase
  # ---------------------------------------------------------------------------

  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  firebase_analytics: ^12.4.5
  firebase_crashlytics: ^5.2.6
  firebase_performance: ^0.11.4+5
  firebase_messaging: ^16.4.3
  firebase_remote_config: ^6.3.1
  firebase_app_check: ^0.4.5+2
  google_sign_in: ^7.2.0
  fl_chart: ^1.2.0
  in_app_purchase: ^3.2.0
  confetti: ^0.7.0

  # ---------------------------------------------------------------------------
  # Google Cloud / Admin
  # ---------------------------------------------------------------------------

  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  auto_size_text: ^3.0.0
  integration_test:
    sdk: flutter

dev_dependencies:
  # ---------------------------------------------------------------------------
  # Testing
  # ---------------------------------------------------------------------------

  flutter_test:
    sdk: flutter

  # ---------------------------------------------------------------------------
  # Linting
  # ---------------------------------------------------------------------------

  flutter_lints: ^6.0.0

  # ---------------------------------------------------------------------------
  # Code Generation
  # ---------------------------------------------------------------------------

  build_runner: ^2.4.15
  freezed: ^3.2.5
  json_serializable: ^6.14.1

  # ---------------------------------------------------------------------------
  # Mocking
  # ---------------------------------------------------------------------------

  mockito: ^5.4.5
  mocktail: ^1.0.4
  firedart: ^0.9.8

  flutter_launcher_icons: ^0.14.4

# =============================================================================
# FLUTTER LAUNCHER ICONS
# =============================================================================

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_icon.png"
  # Adaptive icons for Android
  adaptive_icon_background: "#1E1045"
  adaptive_icon_foreground: "assets/images/logo_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 24

# =============================================================================
# FLUTTER NATIVE SPLASH
# =============================================================================
#
# IMPORTANT:
# The native splash is intentionally minimal.
#
# It is NOT the actual Soteria splash design.
#
# It exists only as a seamless launch bridge while Flutter initializes.
#
# Native:
#     #090514 (Blank - as requested)
#
# Flutter:
#     splash_bg.png + logo_icon.png + Soteria branding
#
# =============================================================================

flutter_native_splash:
  color: "#090514"
  image: "assets/images/logo_icon.png"
  android: true
  ios: true
  fullscreen: true

  android_12:
    color: "#090514"
    icon_background_color: "#090514"
    image: "assets/images/logo_icon.png"

# =============================================================================
# FLUTTER
# =============================================================================

flutter:
  uses-material-design: true

  # ---------------------------------------------------------------------------
  # Assets
  # ---------------------------------------------------------------------------
  #
  # This includes:
  #
  # assets/images/splash_bg.png
  # assets/images/logo_icon.png
  #
  # along with other images stored inside this directory.
  #
  # ---------------------------------------------------------------------------

  assets:
    - assets/images/
    - assets/avatars/
    - assets/icons/
    - assets/ranks/
