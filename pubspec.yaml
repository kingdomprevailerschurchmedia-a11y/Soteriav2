name: soteria
description: "Soteria is a premium competitive learning platform built with Flutter, following high-end engineering standards and clean architecture."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ---------------------------------------------------------------------------
  # Flutter / UI
  # ---------------------------------------------------------------------------

  flutter_riverpod: any
  go_router: any
  google_fonts: any
  flutter_screenutil: any
  flutter_svg: any
  cupertino_icons: any

  # ---------------------------------------------------------------------------
  # Utilities
  # ---------------------------------------------------------------------------

  intl: any
  shared_preferences: any
  image_picker: any
  logger: any
  shimmer: any
  device_info_plus: any
  package_info_plus: any
  uuid: any
  crypto: any
  connectivity_plus: any
  timeago: any

  # ---------------------------------------------------------------------------
  # Serialization / Models
  # ---------------------------------------------------------------------------

  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0


  # ---------------------------------------------------------------------------
  # Firebase
  # ---------------------------------------------------------------------------

  firebase_core: ^4.14.0
  firebase_auth: ^6.6.0
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  firebase_analytics: ^12.5.0
  firebase_crashlytics: ^5.3.0
  firebase_performance: ^0.11.5
  firebase_messaging: ^16.6.0
  firebase_remote_config: ^6.6.0
  firebase_app_check: ^0.4.7
  google_sign_in: ^7.2.0
  fl_chart: ^1.2.0
  in_app_purchase: ^3.2.0
  confetti: ^0.7.0

  # ---------------------------------------------------------------------------
  # Google Cloud / Admin
  # ---------------------------------------------------------------------------

  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  auto_size_text: ^3.0.0
  integration_test:
    sdk: flutter

  firedart: any
  state_notifier: any
dev_dependencies:
  # ---------------------------------------------------------------------------
  # Testing
  # ---------------------------------------------------------------------------

  flutter_test:
    sdk: flutter

  # ---------------------------------------------------------------------------
  # Linting
  # ---------------------------------------------------------------------------

  flutter_lints: ^6.0.0

  # ---------------------------------------------------------------------------
  # Code Generation
  # ---------------------------------------------------------------------------

  build_runner: ^2.4.15
  freezed: ^3.2.5
  json_serializable: ^6.14.1

  # ---------------------------------------------------------------------------
  # Mocking
  # ---------------------------------------------------------------------------

  mockito: ^5.4.5
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

# =============================================================================
# FLUTTER LAUNCHER ICONS
# =============================================================================

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_icon.png"
  # Adaptive icons for Android
  adaptive_icon_background: "#17112F"
  adaptive_icon_foreground: "assets/images/logo_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 24


# =============================================================================
# FLUTTER
# =============================================================================

flutter:
  uses-material-design: true

  # ---------------------------------------------------------------------------
  # Assets
  # ---------------------------------------------------------------------------
  #
  # This includes:
  #
  # assets/images/splash_bg.webp
  # assets/images/logo_icon.png
  #
  # along with other images stored inside this directory.
  #
  # ---------------------------------------------------------------------------

  assets:
    - assets/images/
    - assets/images/welcome_illustration.png
    - assets/avatars/
    - assets/icons/
    - assets/ranks/
    - assets/data/
